[package]
name = "pacman"
version = "1.0.0"
edition = "2021"
description = "Classic Pacman game logic compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
# `rand` needs a source of entropy on wasm32; the `js` feature pulls it from
# Math.random() via wasm-bindgen.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
